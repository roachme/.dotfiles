base = {
    task = "$HOME/workspace";
    //task = "$HOME/tectask";
};

options = {
    hook = true;    /* enable hooks */
    color = true;   /* enable colors */
    #debug = true;  /* disable debug info */
    #loglvl = "info";
};

/* list of hooks for all projects */
hooks = {
    cat = (
        { bincmd = "cat"; pgname = "gmux"; pgncmd = "show" }
        //{ bincmd = "env-cat"; pgname = "fake"; pgncmd = "show" }
    );
    action = (
        { bincmd = "add"; pgname = "gmux"; pgncmd = "sync" },
        #{ bincmd = "add"; pgname = "struct"; pgncmd = "make" },
        { bincmd = "rm"; pgname = "gmux"; pgncmd = "remove" },
        { bincmd = "cd"; pgname = "gmux"; pgncmd = "sync" },
        { bincmd = "set"; pgname = "gmux"; pgncmd = "sync" }
    );
    # under development
    list = (
        { bincmd = "ls"; pgname = "arch"; pgncmd = "list" }
    );
};

alias = {
    fuck = "gmux show one";
    me = "cat one";
    dir = "conv ls";
    ecat = "env cat";
    dcat = "desk cat";
    show = "cat";
    dd = "desk cd -";
};

env = {
    prio = {
        test = ("low", "mid", "high")
    },
    type = {
    },
}


